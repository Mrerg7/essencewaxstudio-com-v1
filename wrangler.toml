# Cloudflare Workers Static Assets with canonical URL redirects
name = "essencewaxstudio-com-v1"
main = "src/worker.ts"
compatibility_date = "2026-09-16"
# Disable the *.workers.dev preview host so it can't be crawled as a duplicate
# or robots.txt-blocked alternate.
workers_dev = false

[assets]
directory = "./dist"
binding = "ASSETS"
# Required so www/http/index.html redirects in the Worker run before static assets
# are served. Without this, matching assets short-circuit the Worker and www (and
# /index.html) return 200 with a canonical pointing at apex — GSC "Alternate page
# with proper canonical tag" / "Duplicate without user-selected canonical".
run_worker_first = true
# Serve the 404 document with a real 404 status (no soft-404).
not_found_handling = "404-page"
# Keep force-trailing-slash so "/" and directory URLs map to index.html; the
# Worker intercepts alias paths first so GSC never sees Cloudflare's temporary
# 307s ("Page with redirect") — same-host aliases are 200 or permanent 301.
html_handling = "force-trailing-slash"
